<div class="py-[25px] px-[30px] sm:max-w-xl md:max-w-md rounded-xl bg-white">

  <div class="mb-5"><i class="icon-angle-left-long text-[12px] text-[#595959]"></i></div>

  <h2 class="text-[#2F64A3] text-2xl font-bold mb-2">Welcome</h2>

  <div class="flex items-center gap-4 mb-5">

    <img [src]="userAccount?.profilePicture" class="w-16 max-h-16 rounded-full" alt="">

    <div class="flex-1">
      <h3 class="text-[20px] font-medium break-all">{{userAccount.fullName}}</h3>
      <span class="text-base text-[#595959] break-all">{{userAccount.emailOrigin}}</span>
    </div>
  </div>

  <div class="max-w-xl mb-2">
    <label for="input-label" class="block text-[16px] mb-2 ">Password</label>
    <input type="password" id="input-label" formControlName="password"
      class="py-3 px-4 block w-full border border-gray-300 rounded-xl text-sm focus:border-blue-500 focus:ring-blue-500 disabled:opacity-50 disabled:pointer-events-none "
      placeholder="">
  </div>

  <span class="text-[#2F64A3] text-sm font-normal">Forgot Username or Password?</span>

  <div class="max-w-xl my-[30px]">
    <button type="button"
      class="w-full py-3 px-4 inline-flex justify-center items-center gap-x-2 text-sm font-medium rounded-full border border-transparent bg-[#008020] text-white hover:bg-[#008020d4] focus:outline-none focus:bg-green-700 disabled:opacity-50 disabled:pointer-events-none">
      Submit
    </button>
  </div>

  <div class="text-center mb-[20px]">
    <a class="text-base text-[#2F64A3]" href="https://mybdjobs.bdjobs.com/mybdjobs/signin.asp">Sign in to a
      different account</a>
  </div>
  <div class="text-center text-base">
    <p class="text-center text-base">Don't have an account? <a class="text-base font-medium text-[#2F64A3]"
        href="https://mybdjobs.bdjobs.com/createaccount.asp">Sign Up</a></p>
  </div>

</div>
