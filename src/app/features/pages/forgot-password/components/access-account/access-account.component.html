<div class="py-[25px] px-[30px] sm:max-w-xl md:max-w-md mx-auto sm:rounded-xl bg-white">

  <div class="mb-5">
    <button type="button" (click)="goBack()" class="text-[#595959]">
    <i class="icon-angle-left-long text-[12px] text-[#595959]"></i> Back
    </button>
  </div>

  <div class="text-center flex flex-col items-center mb-[30px]">
    <img src="images/Group.svg" class="max-h-16 my-[20px]" alt="">
    <h2 class="text-[#2F64A3] text-2xl font-bold mb-[10px]">Access Your Account</h2>
    <p class="text-base">To access your MyBdjobs account through social media please click on the following button.</p>
  </div>

  <!-- Google SignIN -->
  <div class="max-w-xl pb-[16px]" *ngIf="selectedUserAccountList.socialMediaName === 'G'">
    <a href="javascript:void(0)" (click)="signInWithGoogle()"
      class="w-full py-[10px] px-4 inline-flex justify-center items-center gap-x-2 text-sm font-medium rounded-full border border-gray-300">
      <img src="images/google.svg" class="mr-2" alt="google photo">
      <span class="text-sm font-medium">Sign in with Google</span>
    </a>
  </div>
  
  <!-- LinkedIn SignIn -->
  <div class="max-w-xl pb-[16px]"*ngIf="selectedUserAccountList.socialMediaName === 'L'">
    <a href="https://www.linkedin.com/oauth/v2/authorization?response_type=code&scope=openid,profile,email&client_id=86j14j5dkq6ecn&redirect_uri=https%3A%2F%2Fmybdjobs%2Ebdjobs%2Ecom%2Fmybdjobs%2Flinkedin%5Flogin%2Fl%5Faccountinfo%5Flogin%2Easp"
      class="w-full py-[10px] px-4 inline-flex justify-center items-center gap-x-2 text-sm font-medium rounded-full border border-gray-300">
      <img src="images/linkedin.svg" class="mr-2" alt="google photo">
      <span class="text-sm font-medium">Sign in with Linkedin</span>
    </a>
  </div>

  <div class="text-center mb-[20px]">
    <a class="text-base text-[16px] text-[#2F64A3]" href="https://mybdjobs.bdjobs.com/mybdjobs/signin.asp">Sign in to a
      different account</a>
  </div>
  <div class="text-center">
    <p>Don't have an account? <a class="text-base font-medium text-[#2F64A3]"
        href="https://mybdjobs.bdjobs.com/createaccount.asp">Sign Up</a></p>
  </div>
</div>
