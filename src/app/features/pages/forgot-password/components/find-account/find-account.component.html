<form [formGroup]="findAccountForm" (ngSubmit)="onSubmit()">
  <!-- <pre>{{ findAccountForm.value | json }}</pre> -->

  <div class="py-[25px] px-[30px] sm:max-w-xl md:max-w-md mx-auto sm:rounded-xl bg-white">

    <div class="mb-5">
      <button type="button" (click)="goBack()" class="text-[#595959]">
      <i class="icon-angle-left-long text-[12px] text-[#595959]"></i> Back
      </button>
    </div>

    <div class="text-center flex flex-col items-center mb-4">
      <img src="images/user-find.svg" class="max-h-16 my-[20px]" alt="">
      <h2 class="text-[#2F64A3] text-2xl font-bold mb-4">Find Your Account</h2>
      <p class="text-base">Please enter <b>Username/ Email Address/ Mobile Number</b> that you have used in your My Bdjobs
        account
        in order to access your Username.
      </p>
    </div>
    <div class="max-w-xl pb-[16px] ">
      <label for="input-label" class="block text-[16px] mb-2 ">Username/ Email Address/ Mobile Number</label>
      <input type="email" id="input-label" formControlName="userInfo"
        class="py-3 px-4 mb-2 block w-full border rounded-lg text-sm focus:border-blue-500 focus:ring-blue-500 disabled:opacity-50 disabled:pointer-events-none"
        placeholder=""
        [ngClass]="{'border-red-500': errorMessage}">
        <div *ngIf="errorMessage" class="text-red-500 text-sm pb-4">
          {{ errorMessage }}
        </div>
    </div>

    <div class="max-w-xl pb-[16px]">
      <button type="button" (click)="onSubmit()"
        class="w-full py-3 px-4 inline-flex justify-center items-center gap-x-2 text-sm font-medium rounded-full border border-transparent bg-[#008020] text-white hover:bg-[#008020d4] focus:outline-none focus:bg-green-800 disabled:opacity-50 disabled:pointer-events-none"
        [disabled]="findAccountForm.invalid">
        Submit
      </button>
    </div>

    <div class="text-center mb-[20px]">
      <a class="text-base text-[16px] text-[#2F64A3]" href="https://mybdjobs.bdjobs.com/mybdjobs/signin.asp">Sign in to
        a
        different account</a>
    </div>
    <div class="text-center">
      <p>Don't have an account? <a class="text-base font-medium text-[#2F64A3]"
          href="https://mybdjobs.bdjobs.com/createaccount.asp">Sign Up</a></p>
    </div>
  </div>

</form>
