<form [formGroup]="chooseRecoveryForm">
<!-- <pre>{{ chooseRecoveryForm.value | json }}</pre> -->

  <div class="py-[25px] px-[30px] sm:max-w-xl md:max-w-md sm:rounded-xl bg-white">

    <div class="mb-5">
      <button type="button" (click)="goBack()" class="text-[#595959]">
      <i class="icon-angle-left-long text-[12px] text-[#595959]"></i> Back
      </button>
    </div>

    <!-- <h2 class="text-[#2F64A3] text-2xl font-bold mb-2">Welcome</h2> -->

    <div class="flex items-center gap-4 mb-5">

      <img [src]="selectedUserAccountList?.profilePicture ? selectedUserAccountList.profilePicture : 'images/default-user.png'" class="w-16 max-h-16 rounded-full" alt="">

      <div class="flex-1">
        <h3 class="text-[20px] font-medium break-all">{{selectedUserAccountList.fullName}}</h3>
        <span class="text-base text-[#595959] break-all">{{selectedUserAccountList.emailOrigin}}</span>
      </div>
    </div>

    <p class="text-base mb-4">How do you want to reset your password?</p>

    <div class="max-w-xl pb-[16px]">
      <div class="grid space-y-3">
        <div *ngIf="selectedUserAccountList.emailOrigin !== ''" class="relative flex items-start">
          <div class="flex items-center h-5 mt-1">
            <input id="hs-radio-email" formControlName="resetMethod" name="resetMethod" type="radio" value="email"
              class="border-gray-200 rounded-full text-blue-600 focus:ring-blue-500"
              aria-describedby="hs-radio-email-description" checked="">
          </div>
          <label for="hs-radio-email" class="ms-3">
            <span class="block text-base font-medium text-gray-800">Send code via Email</span>
          </label>
        </div>
        <div *ngIf="selectedUserAccountList.phone !== ''" class="relative flex items-start">
          <div class="flex items-center h-5 mt-1">
            <input id="hs-radio-sms" formControlName="resetMethod" name="resetMethod" type="radio" value="sms"
              class="border-gray-200 rounded-full text-blue-600 focus:ring-blue-500"
              aria-describedby="hs-radio-sms-description" checked="">
          </div>
          <label for="hs-radio-sms" class="ms-3">
            <span class="block text-base font-medium text-gray-800">Send code via Mobile SMS</span>
            <span id="hs-radio-sms-description" class="block text-sm text-black">+880 1{{selectedUserAccountList.phone}}</span>
          </label>
        </div>
      </div>

      <p class="text-base mt-5 mb-4">Want to Sign in with your existing Username?</p>

      <div class="relative flex items-start">
        <div class="flex items-center h-5 mt-1">
          <input id="hs-radio-password" formControlName="resetMethod" name="resetMethod" type="radio" value="password"
            class="border-gray-200 rounded-full text-blue-600 focus:ring-blue-500"
            aria-describedby="hs-radio-password-description" checked="">
        </div>
        <label for="hs-radio-password" class="ms-3">
          <span class="block text-base font-medium text-gray-800">Enter password to Sign in</span>
        </label>
      </div>
    </div>

    <div class="max-w-xl pb-[16px] flex justify-center gap-4">
      <button type="button" (click)="cancel()"
        class="py-[10px] flex-1 inline-flex justify-center items-center gap-x-2 text-sm font-medium rounded-full border border-[#D1C7CD] text-[#757575] hover: focus:outline-1 focus:text-[#2F64A3] focus:border-[#2F64A3] disabled:opacity-50 disabled:pointer-events-none">
        Not You?
      </button>
      <button type="button" (click)="onContinue()"
        class="py-[10px]  flex-1 inline-flex justify-center items-center gap-x-2 text-sm font-medium rounded-full border border-transparent bg-[#008020] text-white hover:bg-[#008020d4] focus:outline-none focus:bg-blue-700 disabled:opacity-50 disabled:pointer-events-none"
        [disabled]="chooseRecoveryForm.invalid">
        Continue
      </button>
    </div>

    <div class="text-center mb-[20px]">
      <a class="text-base text-[#2F64A3]" href="https://mybdjobs.bdjobs.com/mybdjobs/signin.asp">Sign in to a
        different account</a>
    </div>
    <div class="text-center text-base">
      <p class="text-center text-base">Don't have an account? <a class="text-base font-medium text-[#2F64A3]"
          href="https://mybdjobs.bdjobs.com/createaccount.asp">Sign Up</a></p>
    </div>

  </div>
</form>
